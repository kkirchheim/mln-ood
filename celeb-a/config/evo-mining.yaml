- 'black_hair'#
- 'bushy_eyebrows'#
- 'pale_skin'#
- 'young'
- 'eyeglasses'#
- 'wearing_lipstick'
- 'narrow_eyes'#
- 'wearing_earrings'#
- 'high_cheekbones'#
- 'double_chin'#
# - '5_o_clock_shadow'#
- 'blurry'#
- 'rosy_cheeks'#
