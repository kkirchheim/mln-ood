defaults:
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

hydra:
  job_logging:
    handlers:
      file:
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log

n_seeds: 10
device: "cuda"

backbone: "resnet18"

use_oe: True

fit_score_dist_on: "val"
fit_score_dist: "genextreme"

paths:
  root: "/run/media/ki/data/datasets/"
  models: "/run/media/ki/data/mln-ood/celeba/models/${backbone}/"
  predictions: "/run/media/ki/data/mln-ood/celeba/predictions/${backbone}/"

constraints:
# 28.03.25 this was from mining, 39 attributes
#- (big_nose xor wearing_lipstick)
#- (high_cheekbones -> wearing_necktie)
#- (no_beard or male)
#- (not wearing_necktie -> (blond_hair or young))
#- attractive
#- blurry

#- ((blond_hair xor bald) or (no_beard xor brown_hair))
#- ((male or not blond_hair) and (bald or not blond_hair))
#- ((receding_hairline -> male) -> no_beard)
#- (bald -> (not mustache xor blond_hair))
#- (wearing_lipstick -> wearing_lipstick)
#- (young and heavy_makeup)
#- brown_hair
#- receding_hairline

# 27-02-25 this came out of the mining, fully implemented
- ((male or no_beard) or (wearing_lipstick or bald))
- ((not gray_hair and no_beard) and (bald or wearing_lipstick))
- ((receding_hairline and not young) xor (attractive -> mustache))
- ((wearing_lipstick and attractive) and male)
- (attractive and young)


datasets:
- "LSUNCrop"
- "LSUNResize"
# - "Textures"
- "TinyImageNetCrop"
- "TinyImageNetResize"
- "Places365"
- "iNaturalist"
- "GaussianNoise"
- "UniformNoise"

attributes:
- 'blond_hair'
- 'gray_hair'
- 'arched_eyebrows'
- 'chubby'
- 'big_nose'
- 'receding_hairline'
- 'heavy_makeup'
- 'brown_hair'
- 'big_lips'
- 'wavy_hair'
- 'black_hair'
- 'bushy_eyebrows'
- 'pale_skin'
- 'young'
- 'eyeglasses'
- 'wearing_lipstick'
- 'narrow_eyes'
- 'wearing_earrings'
- 'high_cheekbones'
- 'double_chin'
# - '5_o_clock_shadow'#
- 'blurry'
- 'rosy_cheeks'
- 'bangs'
- 'mustache'
- 'wearing_necklace'
- 'male'
- 'goatee'
- 'wearing_necktie'
- 'oval_face'
- 'attractive'
- 'sideburns'
- 'smiling'
- 'bags_under_eyes'
- 'mouth_slightly_open'
- 'straight_hair'
- 'bald'
- 'no_beard'
- 'wearing_hat'
- 'pointy_nose'
- "oe"

target_att: "brown_hair"

mln:
  train_on: "val"
  epochs: 1
  batch_size: 40000
  lr: 1
  loss: "pseudo"
  init: 0.0