
defaults:
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

note_minded_dataset: TinyImageNetCrop
n_seeds: 10
device: "cuda"

backbone: "resnet18"

use_oe: False


fit_score_dist_on: "val"
fit_score_dist: "genextreme"

paths:
  root: "/run/media/ki/data/datasets/"
  models: "/run/media/ki/data/mln-ood/celeba/models/resnet18/"
  predictions: "/run/media/ki/data/mln-ood/celeba/predictions/resnet18/"

constraints:
- gray_hair
- male
- attractive
- mustache -> not attractive



datasets:
- LSUNCrop
- LSUNResize
- Textures
- TinyImageNetResize
- Places365
- iNaturalist
- GaussianNoise
- UniformNoise



