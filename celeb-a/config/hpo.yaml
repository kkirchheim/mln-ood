defaults:
  - override hydra/sweeper: optuna
  - override hydra/sweeper/sampler: random
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

atts: ['Wearing_Lipstick', "Heavy_Makeup", "Male", "Mustache", "No_Beard", "Goatee", "Sideburns",  "Gray_Hair", "Young"]

target_att: "Young"

mln:
  train_on: "val"
  epochs: 10
  batch_size: 128
  lr: 0.05
  weight_decay: 0.1
  momentum: 0.9
  nesterov: True

hydra:
  sweeper:
    sampler:
      seed: 123
    direction: maximize
    study_name: sphere
    # storage: null
    n_trials: 1000
    n_jobs: 2
    # max_failure_rate: 0.0
    params:
      mln.train_on: choice("train", "val")
      mln.nesterov: choice(True, False)
      mln.epochs: range(1, 100, step=10)
      mln.batch_size: choice(32,64,128,256,512,2048)
      mln.lr: range(0.0001, 0.1, step=0.0001)
      mln.weight_decay: range(0.0, 1.0, step=0.0001)
      mln.momentum: range(0.0, 0.9, step=0.1)

n_seeds: 1
device: "cuda"
root: "/run/media/ki/data/datasets/celeba/"

model_out_dir: "/run/media/ki/data/mln-ood/celeba/models/"
predictions_out_dir: "/run/media/ki/data/mln-ood/celeba/predictions/"


