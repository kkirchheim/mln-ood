defaults:
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

hydra:
  job_logging:
    handlers:
      file:
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log

device: "cuda"
backbone: "resnet18"

n_seeds: 5

paths:
  root: "/run/media/ki/data/datasets/"
  models: "/run/media/ki/data/mln-ood/rival10/models/${backbone}/"
  predictions: "/run/media/ki/data/mln-ood/rival10/predictions/${backbone}/"

dataset: "Textures"
validate_on: "val"

min_delta: 0.0025

attributes:
 - 'long_snout'
 - 'wings'
 - 'wheels'
 - 'text'
 - 'horns'
 - 'floppy_ears'
 - 'ears'
 - 'colored_eyes'
 - 'tail'
 - 'mane'
 - 'beak'
 - 'hairy'
 - 'metallic'
 - 'rectangular'
 - 'wet'
 - 'long'
 - 'tall'
 - 'patterned'
 - 'label'



mln:
  train_on: "train"
  epochs: 1
  batch_size: 400000
  lr: 1.0
  init: 0.0
#  weight_decay: 0.0
#  momentum: 0.0
#  nesterov: False
