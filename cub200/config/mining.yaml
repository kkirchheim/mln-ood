defaults:
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

hydra:
  job_logging:
    handlers:
      file:
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log

device: "cuda"
backbone: "resnet50"

n_seeds: 5

validate_on: "val"

paths:
  root: "/run/media/ki/data/datasets/"
  models: "/run/media/ki/data/mln-ood/cub200/models/${backbone}/"
  predictions: "/run/media/ki/data/mln-ood/cub200/predictions/${backbone}/"

dataset: "Textures"

min_delta: 0.01
# min_perf: 0.86

